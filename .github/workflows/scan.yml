name: SMC Signal Scan

on:
  schedule:
    # Runs every 30 minutes (UTC). GitHub's cron scheduler can lag a few
    # minutes under load — that's normal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you (or an external trigger like cron-job.org) trigger a run manually

permissions:
  contents: write   # needed so the workflow can commit updated state.json back

concurrency:
  group: smc-scan
  cancel-in-progress: false   # let a run finish rather than killing it mid-fetch

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "smc-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update trade state [skip ci]"
          git push
